<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Job Finder &amp; CV Analyzer</title>
<style>
:root{--bg:#f2f5f1;--card:#fff;--tx:#12201c;--mu:#5d6e68;--br:#dbe3de;--ac:#0f766e;--acs:#d6efe9;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1512;--card:#13221d;--tx:#e6f1ed;--mu:#94aaa2;--br:#24382f;--ac:#3fd0b8;--acs:#12352e;--ok:#4ade80;--bad:#f87171}}
:root[data-theme=dark]{--bg:#0b1512;--card:#13221d;--tx:#e6f1ed;--mu:#94aaa2;--br:#24382f;--ac:#3fd0b8;--acs:#12352e;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:0 0 .5rem;line-height:1.2}
header{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--br);flex-wrap:wrap}header h1{font-size:1.15rem;margin:0;flex:1;min-width:170px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 18px;border-bottom:1px solid var(--br)}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 13px}
button.on,.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
main{max-width:1050px;margin:0 auto;padding:18px}.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}.grid>.card{margin:0}
.mu{color:var(--mu)}.err{color:var(--bad)}.ok{color:var(--ok)}.hide{display:none}.big{font:2.1rem/1 Georgia,serif}
.chip{display:inline-block;padding:2px 10px;margin:2px 4px 2px 0;border-radius:99px;background:var(--acs);font-size:13px}.chip.m{background:none;border:1px solid var(--bad);color:var(--bad)}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--br);border-radius:8px;padding:8px;margin-bottom:8px}
.drop{display:block;border:2px dashed var(--br);border-radius:12px;padding:26px;text-align:center;cursor:pointer}.drop:hover{border-color:var(--ac)}
.bar{height:8px;border-radius:9px;background:var(--br);overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.srch{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr auto;gap:8px}
.srch input,.srch select{margin:0}@media(max-width:760px){.srch{grid-template-columns:1fr 1fr}.srch input:first-child{grid-column:1/3}}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto}.kan h3{text-transform:capitalize}
.sk{height:90px;border-radius:12px;background:var(--br);margin-bottom:14px;opacity:.6}ul{padding-left:18px}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<header><h1>AI Job Finder &amp; CV Analyzer</h1><button id="th">Dark / Light</button><button id="lo" class="hide" onclick="out()">Log out</button></header>
<nav id="nav" class="hide"><button data-v="dash">Dashboard</button><button data-v="cv">My CV</button><button data-v="jobs">Find jobs</button><button data-v="track">Applications</button></nav>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['saved','applied','interview','offer','rejected'],chips=(a,m)=>(a||[]).map(x=>`<span class="chip${m?' m':''}">${esc(x)}</span>`).join('');
let tok=localStorage.token||'',me=localStorage.name||'',resume=null,tracked=[],jobs=null,mm={},imp=null,view='dash',msg='',mode='login',q={kw:'',loc:'',c:'de',ty:''},busy='';
async function api(p,o={}){const h={};if(tok)h.Authorization='Bearer '+tok;let b=o.body;if(o.json){h['Content-Type']='application/json';b=JSON.stringify(o.json)}
 const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:b}),d=await r.json().catch(()=>null);
 if(!r.ok){if(r.status===401&&tok)out();throw new Error(d?.error||'Request failed')}return d}
function out(){localStorage.removeItem('token');localStorage.removeItem('name');location.reload()}
const root=document.documentElement;if(localStorage.theme)root.dataset.theme=localStorage.theme;
$('#th').onclick=()=>{const d=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=d?'light':'dark';localStorage.theme=root.dataset.theme};
$('#nav').onclick=e=>e.target.dataset.v&&go(e.target.dataset.v);
async function init(){if(!tok)return go('auth');try{[resume,tracked]=await Promise.all([api('/resumes/latest'),api('/saved')])}catch(e){return}go('dash')}
function go(v){view=v;const a=v==='auth';$('#nav').classList.toggle('hide',a);$('#lo').classList.toggle('hide',a);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()}
function render(){$('#app').innerHTML=V[view]()}
const V={};
V.auth=()=>`<div class="card" style="max-width:380px;margin:30px auto"><h2>${mode=='login'?'Log in':'Create account'}</h2><p class="err" role="alert">${esc(msg)}</p><form onsubmit="return auth(event)">${mode=='login'?'':'<input id="nm" placeholder="Name" required>'}<input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password (8+ characters)" minlength="8" required><button class="p" style="width:100%">${mode=='login'?'Log in':'Create account'}</button></form><p><a href="#" onclick="mode=mode=='login'?'register':'login';msg='';render();return false">${mode=='login'?'New here? Create an account':'Have an account? Log in'}</a></p></div>`;
async function auth(e){e.preventDefault();try{const d=await api('/auth/'+mode,{method:'POST',json:{name:$('#nm')?.value,email:$('#em').value,password:$('#pw').value}});tok=d.token;me=d.name;localStorage.token=tok;localStorage.name=me;msg='';await init()}catch(x){msg=x.message;render()}return false}
V.dash=()=>{if(!resume)return`<div class="card"><h2>Hello, ${esc(me)}</h2><p>Upload your CV to get your score, your skills and job matches.</p><button class="p" onclick="go('cv')">Upload CV</button></div>`;
 const a=resume.analysis,n=s=>tracked.filter(t=>t.status===s).length,gap={};tracked.forEach(t=>(t.match?.missingSkills||[]).forEach(s=>gap[s]=(gap[s]||0)+1));
 const gaps=Object.entries(gap).sort((x,y)=>y[1]-x[1]).slice(0,8).map(x=>x[0]);
 return`<h2>Hello, ${esc(me)}</h2><div class="grid">${[['CV score',a.cvScore+'/100'],['Skills found',a.skills.length],['Saved',n('saved')],['Applied',n('applied')],['Interviews',n('interview')]].map(x=>`<div class="card"><div class="mu">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div><div class="card"><h3>Top skills</h3>${chips(a.skills.slice(0,16))}</div><div class="card"><h3>Missing skills in jobs you analyzed</h3>${chips(gaps,1)||'<span class="mu">Analyze a job match to see skill gaps.</span>'}</div><button class="p" onclick="go('jobs')">Find jobs</button>`};
V.cv=()=>`<div class="card"><h2>Upload your CV</h2><label class="drop"><input type="file" accept="application/pdf" class="hide" onchange="upl(this.files[0])"><b>Choose a PDF</b><div class="mu">PDF only, max 5 MB. Your CV is uploaded for analysis and job matching. You can delete it any time.</div></label><p id="st" class="mu" role="status">${esc(busy)}</p></div>${resume?cvRes():''}`;
function cvRes(){const a=resume.analysis,s=a.scores||{};return`<div class="card"><div class="row"><h2>CV score: ${a.cvScore}/100</h2><span class="mu">${esc(resume.fileName)}</span></div><p class="mu">Application-generated assessment, not an official ATS score.</p>${Object.entries(s).map(([k,v])=>`<div class="row"><span style="text-transform:capitalize">${k}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div>`).join('')}</div>
<div class="grid"><div class="card"><h3>Profile</h3><div>${esc(a.name)} ${a.email?'- '+esc(a.email):''}</div><div class="mu">${esc(a.location)} ${esc(a.careerField)}</div><h3 style="margin-top:10px">Education</h3>${(a.education||[]).map(e=>`<div>${esc(e.degree)}, ${esc(e.university)} ${esc(e.year||'')}</div>`).join('')}<h3 style="margin-top:10px">Experience</h3>${(a.experience||[]).map(e=>`<div>${esc(e.title)}, ${esc(e.company)}</div>`).join('')||'<span class="mu">None found</span>'}</div><div class="card"><h3>Skills</h3>${chips(a.skills)}<h3 style="margin-top:10px">Projects</h3><ul>${(a.projects||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></div>
<div class="card"><h3>Suggestions</h3><ul>${(a.suggestions||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="p" onclick="improve()">${busy==='imp'?'Working...':'Improve my CV with AI'}</button> <button onclick="delCv()">Delete CV</button>${imp?`<h3 style="margin-top:14px">Better wording</h3>${(imp.weakBullets||[]).map(b=>`<p><span class="mu">Before:</span> ${esc(b.original)}<br><span class="ok">After:</span> ${esc(b.improved)}</p>`).join('')}<div class="mu">Missing keywords</div>${chips(imp.missingKeywords,1)}<div class="mu">Skills to learn</div>${chips(imp.skillsToLearn)}<div class="mu">ATS tips</div><ul>${(imp.atsTips||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`}
async function upl(f){if(!f)return;busy='Uploading and analyzing your CV. This can take up to 30 seconds...';render();try{resume=await api('/resumes/upload',{method:'POST',body:(()=>{const d=new FormData;d.append('cv',f);return d})()});imp=null;busy=''}catch(e){busy=e.message}render()}
async function improve(){busy='imp';render();try{imp=await api('/ai/improve-cv',{method:'POST',json:{targetRole:q.kw}})}catch(e){alert(e.message)}busy='';render()}
async function delCv(){if(!confirm('Delete your CV and its analysis?'))return;await api('/resumes/'+resume.id,{method:'DELETE'});resume=null;imp=null;render()}
const money=j=>j.salaryMin?`${Math.round(j.salaryMin).toLocaleString()}${j.salaryMax?' - '+Math.round(j.salaryMax).toLocaleString():''}`:'';
const CO=[['de','Germany'],['gb','United Kingdom'],['us','United States'],['ca','Canada'],['au','Australia'],['in','India'],['nl','Netherlands'],['fr','France'],['sg','Singapore']];
V.jobs=()=>`<div class="card"><form class="srch" onsubmit="return find(event)"><input id="kw" placeholder="Job title or keyword" value="${esc(q.kw)}" aria-label="Keyword"><input id="lc" placeholder="City" value="${esc(q.loc)}" aria-label="Location"><select id="co" aria-label="Country">${CO.map(c=>`<option value="${c[0]}"${c[0]==q.c?' selected':''}>${c[1]}</option>`).join('')}</select><select id="ty" aria-label="Job type">${[['','Any type'],['full_time','Full-time'],['part_time','Part-time'],['contract','Contract'],['internship','Internship'],['remote','Remote']].map(t=>`<option value="${t[0]}"${t[0]==q.ty?' selected':''}>${t[1]}</option>`).join('')}</select><button class="p">Search</button></form></div>${busy==='jobs'?'<div class="sk"></div>'.repeat(3)+'<p class="mu" role="status">Searching jobs...</p>':jobs===null?'<p class="mu">Search for a role to see live listings.</p>':jobs.length?jobs.map(jc).join(''):'<p>No jobs found. Try another keyword or location.</p>'}<p class="mu">Jobs by <a href="https://www.adzuna.com" target="_blank" rel="noopener">Adzuna</a></p>`;
const jc=(j,i)=>{const m=mm[j.id],sv=tracked.some(t=>t.externalId===j.id);return`<div class="card"><div class="row"><h3 style="margin:0">${esc(j.title)}</h3>${m?`<b class="big" style="font-size:1.5rem">${m.matchScore}%</b>`:''}</div><div class="mu">${esc(j.company)} - ${esc(j.location)} ${j.type?'- '+esc(j.type.replace('_','-')):''} ${money(j)?'- '+money(j):''}</div><p>${esc(j.description.slice(0,220))}...</p>${m?`<div class="bar"><i style="width:${m.matchScore}%"></i></div>${chips(m.matchedSkills)}${chips(m.missingSkills,1)}<p>${esc(m.summary)}</p><ul>${m.recommendations.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}<a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Apply on original site</a> <button onclick="doMatch(${i})">${busy==='m'+i?'Analyzing...':'Analyze match'}</button> <button onclick="save(${i})"${sv?' disabled':''}>${sv?'Saved':'Save job'}</button></div>`};
async function find(e){e.preventDefault();q={kw:$('#kw').value,loc:$('#lc').value,c:$('#co').value,ty:$('#ty').value};busy='jobs';render();try{jobs=(await api('/jobs?'+new URLSearchParams({keyword:q.kw,location:q.loc,country:q.c,type:q.ty}))).jobs}catch(x){jobs=[];alert(x.message)}busy='';render();return false}
async function doMatch(i){busy='m'+i;render();try{mm[jobs[i].id]=await api('/ai/match-job',{method:'POST',json:{job:jobs[i]}})}catch(x){alert(x.message)}busy='';render()}
async function save(i){try{await api('/saved',{method:'POST',json:{job:jobs[i],match:mm[jobs[i].id]}});tracked=await api('/saved');render()}catch(x){alert(x.message)}}
V.track=()=>`<h2>Application tracker</h2><div class="kan">${ST.map(s=>`<div><h3>${s} (${tracked.filter(t=>t.status===s).length})</h3>${tracked.filter(t=>t.status===s).map(t=>`<div class="card"><b>${esc(t.job.title)}</b><div class="mu">${esc(t.job.company)}${t.match?' - '+t.match.matchScore+'% match':''}</div><select onchange="mv('${t.id||t._id}',this.value)" aria-label="Status">${ST.map(x=>`<option${x==t.status?' selected':''}>${x}</option>`).join('')}</select><a href="${esc(t.job.url)}" target="_blank" rel="noopener">Open</a> <button onclick="rm('${t._id}')">Remove</button></div>`).join('')}</div>`).join('')}</div>`;
async function mv(id,s){await api('/saved/'+id,{method:'PATCH',json:{status:s}});tracked=await api('/saved');render()}
async function rm(id){await api('/saved/'+id,{method:'DELETE'});tracked=await api('/saved');render()}
init();
</script></body></html>
